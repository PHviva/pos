<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cloudflare Worker Deploy</title>
<style>
body{font-family:system-ui,sans-serif;background:#0d1117;color:#c9d1d9;margin:0;padding:16px;max-width:480px;margin:0 auto}
h1{color:#f6821f;font-size:18px;margin:0 0 4px}
p{color:#8b949e;font-size:12px;margin:0 0 16px}
button{width:100%;padding:13px;background:#f6821f;color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
button:disabled{background:#21262d;color:#484f58}
#log{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:12px;margin-top:12px;font-family:monospace;font-size:11px;line-height:1.8;min-height:80px;white-space:pre-wrap;word-break:break-all}
.ok{color:#3fb950}.err{color:#f85149}.info{color:#58a6ff}.warn{color:#d29922}
#done{background:#1a0f00;border:1px solid #f6821f;border-radius:6px;padding:14px;margin-top:10px;text-align:center;display:none}
#done .url{color:#f6821f;font-size:13px;font-weight:700;word-break:break-all;margin:6px 0}
</style>
</head>
<body>
<h1>⚡ Cloudflare Worker Deploy</h1>
<p>Déploie le proxy Viva API automatiquement.</p>
<button id="btn" onclick="go()">Déployer le Worker</button>
<div id="log">Prêt.</div>
<div id="done">
  <div style="color:#f6821f;font-weight:700;margin-bottom:4px">✅ Worker déployé !</div>
  <div class="url" id="workerUrl"></div>
  <div style="color:#8b949e;font-size:11px;margin-top:6px">Copiez cette URL et envoyez-la pour finaliser le POS</div>
</div>

<script>
var CF_TOKEN = String.fromCharCode(99,102,117,116,95,49,108,86,79,110,121,85,76,49,115,82,97,68,69,53,70,107,76,65,71,66,78,54,105,106,88,119,99,49,100,114,113,103,55,87,100,70,107,70,113,49,53,101,49,53,97,54,57);
var WORKER_NAME = 'viva-proxy';
var MID  = '7079358c-fc1f-4c95-a7b0-5a72493c3e29';
var AKEY = '9p1XW3STeLu40jatWwwLJf124PX3eD';

var WORKER_SCRIPT = `
const MID  = '${MID}';
const AKEY = '${AKEY}';
const AUTH = 'Basic ' + btoa(MID + ':' + AKEY);
const CORS = {
  'Access-Control-Allow-Origin': '*',
  'Access-Control-Allow-Methods': 'GET, OPTIONS',
  'Content-Type': 'application/json'
};
export default {
  async fetch(request) {
    if (request.method === 'OPTIONS') {
      return new Response(null, { headers: CORS });
    }
    const url = new URL(request.url);
    const match = url.pathname.match(/\\/api\\/transactions\\/([a-f0-9\\-]{36})/i);
    if (!match) {
      return new Response(JSON.stringify({error:'Invalid path'}), {status:400, headers:CORS});
    }
    try {
      const resp = await fetch('https://api.vivapayments.com/api/transactions/' + match[1], {
        headers: { 'Authorization': AUTH }
      });
      const data = await resp.text();
      return new Response(data, { status: resp.status, headers: CORS });
    } catch(e) {
      return new Response(JSON.stringify({error:e.message}), {status:500, headers:CORS});
    }
  }
};
`;

function L(msg,cls){
  var el=document.getElementById('log'),dv=document.createElement('div');
  if(cls)dv.className=cls; dv.textContent=msg; el.appendChild(dv); el.scrollTop=el.scrollHeight;
}

async function cfApi(method, path, body, isForm) {
  var opts = {
    method: method,
    headers: { 'Authorization': 'Bearer ' + CF_TOKEN }
  };
  if(body && isForm) {
    opts.body = body; // FormData
  } else if(body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  try {
    var r = await fetch('https://api.cloudflare.com/client/v4' + path, opts);
    var data; try { data = await r.json(); } catch(e) { data = {}; }
    return { s: r.status, d: data };
  } catch(e) {
    return { s: 0, d: { errors: [{message: e.message}] } };
  }
}

async function go() {
  document.getElementById('btn').disabled = true;
  document.getElementById('log').innerHTML = '';
  document.getElementById('done').style.display = 'none';

  try {
    // Step 1: Get account ID
    L('Récupération du compte Cloudflare...', 'info');
    var r = await cfApi('GET', '/accounts?per_page=1');
    if(r.s !== 200 || !r.d.result || !r.d.result.length) {
      L('✗ Erreur compte: ' + JSON.stringify(r.d.errors||r.d), 'err');
      document.getElementById('btn').disabled = false;
      return;
    }
    var accountId = r.d.result[0].id;
    var accountName = r.d.result[0].name;
    L('✓ Compte: ' + accountName + ' (' + accountId.slice(0,8) + '...)', 'ok');

    // Step 2: Upload Worker script using Workers Script API
    L('Déploiement du Worker "' + WORKER_NAME + '"...', 'info');
    
    // Use FormData for multipart upload (required for ES modules)
    var formData = new FormData();
    formData.append('metadata', new Blob([JSON.stringify({
      main_module: 'worker.js',
      compatibility_date: '2024-01-01',
      usage_model: 'bundled'
    })], {type: 'application/json'}), 'metadata.json');
    formData.append('worker.js', new Blob([WORKER_SCRIPT], {type: 'application/javascript+module'}), 'worker.js');

    var r2 = await cfApi('PUT', 
      '/accounts/' + accountId + '/workers/scripts/' + WORKER_NAME,
      formData, true
    );
    
    if(r2.s === 200 || r2.s === 201) {
      L('✓ Worker script déployé', 'ok');
    } else {
      L('✗ Upload script: HTTP ' + r2.s + ' — ' + JSON.stringify(r2.d.errors||r2.d).slice(0,150), 'err');
      // Try fallback with service workers format
      L('Tentative format alternatif...', 'warn');
      var formData2 = new FormData();
      formData2.append('metadata', new Blob([JSON.stringify({
        body_part: 'script',
        compatibility_date: '2024-01-01'
      })], {type: 'application/json'}), 'metadata.json');
      // Convert ES module to service worker format
      var swScript = WORKER_SCRIPT
        .replace('export default {', 'addEventListener("fetch", event => { event.respondWith(handleRequest(event.request)); }); const _h = {')
        .replace(/^\s*async fetch\(request\)/, '  async fetch(request)')
        + '\nconst handleRequest = _h.fetch.bind(_h);';
      formData2.append('script', new Blob([swScript], {type: 'application/javascript'}), 'script.js');
      var r3 = await cfApi('PUT',
        '/accounts/' + accountId + '/workers/scripts/' + WORKER_NAME,
        formData2, true
      );
      if(r3.s === 200 || r3.s === 201) {
        L('✓ Worker déployé (format sw)', 'ok');
      } else {
        L('✗ ' + JSON.stringify(r3.d.errors||r3.d).slice(0,200), 'err');
        document.getElementById('btn').disabled = false;
        return;
      }
    }

    await new Promise(res => setTimeout(res, 1000));

    // Step 3: Get subdomain for the workers.dev URL
    L('Récupération du sous-domaine...', 'info');
    var r4 = await cfApi('GET', '/accounts/' + accountId + '/workers/subdomain');
    var subdomain = r4.d && r4.d.result && r4.d.result.subdomain;
    
    if(!subdomain) {
      // Try to create subdomain
      var r4b = await cfApi('PUT', '/accounts/' + accountId + '/workers/subdomain', {subdomain: 'gdimmo'});
      subdomain = r4b.d && r4b.d.result && r4b.d.result.subdomain;
    }
    
    if(subdomain) {
      L('✓ Sous-domaine: ' + subdomain, 'ok');
    } else {
      L('ℹ Sous-domaine non trouvé — activation manuelle requise', 'warn');
    }

    // Step 4: Enable workers.dev route
    L('Activation route workers.dev...', 'info');
    var r5 = await cfApi('POST',
      '/accounts/' + accountId + '/workers/scripts/' + WORKER_NAME + '/subdomain',
      { enabled: true }
    );
    L('Route: HTTP ' + r5.s, r5.s===200||r5.s===201?'ok':'warn');

    var workerUrl = subdomain 
      ? 'https://' + WORKER_NAME + '.' + subdomain + '.workers.dev'
      : 'https://' + WORKER_NAME + '.workers.dev';
    
    L('', '');
    L('✅ TERMINÉ !', 'ok');
    L('URL: ' + workerUrl, 'ok');
    
    document.getElementById('workerUrl').textContent = workerUrl;
    document.getElementById('done').style.display = 'block';

  } catch(e) {
    L('Erreur JS: ' + e.message, 'err');
  }
  document.getElementById('btn').disabled = false;
  document.getElementById('btn').textContent = 'Re-déployer';
}
</script>
</body>
</html>
