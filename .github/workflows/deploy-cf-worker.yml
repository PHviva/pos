name: Deploy Cloudflare Worker
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy viva-proxy
        run: |
          CF_TOKEN=$(echo Y2Z1dF8xbFZPbnlVTDFzUmFERTVGa0xBR0JONmlqWHdjMWRycWc3V2RGa0ZxMTVlMTVhNjk= | base64 -d)
          MID=$(echo NzA3OTM1OGMtZmMxZi00Yzk1LWE3YjAtNWE3MjQ5M2MzZTI5 | base64 -d)
          AKEY=$(echo OXAxWFczU1RlTHU0MGphdFd3d0xKZjEyNFBYM2VE | base64 -d)
          
          ACCOUNT_ID=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=1" | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['result'][0]['id'])")
          echo "Account: $ACCOUNT_ID"
          
          cat > worker.js << 'EOF'
const A='Basic '+btoa('7079358c-fc1f-4c95-a7b0-5a72493c3e29:9p1XW3STeLu40jatWwwLJf124PX3eD'),C={'Access-Control-Allow-Origin':'*','Content-Type':'application/json'};
export default{async fetch(r){
  if(r.method==='OPTIONS')return new Response(null,{headers:C});
  const m=new URL(r.url).pathname.match(/\/api\/transactions\/([\w-]{36})/i);
  if(!m)return new Response('{}',{status:400,headers:C});
  const x=await fetch('https://api.vivapayments.com/api/transactions/'+m[1],{headers:{Authorization:A}});
  return new Response(await x.text(),{status:x.status,headers:C});
}};
EOF
          
          RESULT=$(curl -sf -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/viva-proxy" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -F 'metadata={"main_module":"worker.js","compatibility_date":"2024-01-01"};type=application/json' \
            -F 'worker.js=@worker.js;type=application/javascript+module')
          echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Deployed OK' if d.get('success') else 'Error: '+str(d.get('errors')))"
          
          SUBDOMAIN=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/subdomain" | \
            python3 -c "import sys,json; print(json.load(sys.stdin).get('result',{}).get('subdomain','unknown'))")
          
          curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/viva-proxy/subdomain" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            -d '{"enabled":true}' > /dev/null
          
          echo "✅ Worker URL: https://viva-proxy.$SUBDOMAIN.workers.dev"

